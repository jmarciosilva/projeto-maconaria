server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Deve acompanhar o post_max_size do PHP (deploy/php.ini = 128M), senao o
    # Nginx rejeita o upload com 413 antes de o PHP receber o corpo.
    # OBS: o Nginx do HOST tambem precisa de client_max_body_size >= 128M
    # (hoje esta em 100M) para que este limite seja efetivo ponta a ponta.
    client_max_body_size 128M;

    # Headers para o proxy reverso (Docker subnet)
    # O Nginx HOST (127.0.0.1) enviará os headers de forwarding
    set_real_ip_from 172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # HTTPS sempre ativo no proxy reverso (SSL terminado no Nginx HOST)
    fastcgi_param HTTPS on;

    # Bloquear acesso a arquivos ocultos, exceto .well-known (Let's Encrypt)
    location ~ /\. {
        return 404;
    }

    location ~ /\.well-known {
        allow all;
    }

    # Rewrite de URLs para Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via FastCGI para o container app:9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Storage público (apenas leitura)
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # Cache para assets estáticos
    location ~ /\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
