; Configurações PHP para produção - ARLS Ferraz

; Upload e POST
; upload_max_filesize permanece em 64M: o Laravel já limita cada fotografia a
; 4 MB (regra max:4096), então este teto por arquivo é apenas folga.
upload_max_filesize = 64M
; post_max_size cobre o corpo inteiro do multipart. Dimensionado para o uso
; real (50 fotos x ~188 KB ~= 9,4 MB) com ampla folga, e NAO para o pior caso
; teorico de 50 x 4 MB = 200 MB: um POST desse tamanho estouraria o
; max_execution_time e seria fragil na banda de upload do administrador.
post_max_size = 128M
; max_file_uploads: 50 fotos + imagem_capa + margem. O default do PHP (20)
; truncava silenciosamente os uploads acima de 20 arquivos.
max_file_uploads = 60

; Memória e execução
memory_limit = 512M
max_execution_time = 120

; OPcache (otimização)
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256M

; Logs
error_log = /dev/stderr
log_errors = 1

; Timezone
date.timezone = America/Sao_Paulo
